[package]
name = "ferrogram"
version = "0.1.0"
edition = "2021"
description = "A blazing-fast, 100% pure-Rust Telegram Bot framework for the Relax JIT compiler"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }

[[example]]
name = "echo_bot"
path = "examples/echo_bot.rs"
